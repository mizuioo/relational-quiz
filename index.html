<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>亲密关系自我倾向自评问卷</title>
<style>
html, body, header, main, section, div, h1, h2, h3, p, label, button, input {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background-color: #f8fafc;
    color: #0f172a;
    line-height: 1.5;
    padding: 16px;
}
.container {
    max-width: 680px;
    margin: 0 auto;
    background: #ffffff;
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08);
}
.header {
    text-align: center;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid #e2e8f0;
}
.header h1 {
    font-size: 20px;
    font-weight: 700;
    color: #1e293b;
    margin-bottom: 6px;
}
.header p {
    font-size: 13px;
    color: #64748b;
}
.progress-container {
    margin-top: 16px;
}
.progress-text {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: #64748b;
    margin-bottom: 6px;
}
.progress-bar-wrap {
    width: 100%;
    height: 6px;
    background: #e2e8f0;
    border-radius: 999px;
    overflow: hidden;
}
.progress-bar-fill {
    height: 100%;
    width: 0%;
    background: #4f46e5;
    transition: width 0.3s ease;
}
.section-title {
    font-size: 15px;
    font-weight: 600;
    color: #334155;
    background: #f1f5f9;
    padding: 10px 14px;
    border-radius: 8px;
    margin: 24px 0 16px 0;
    border-left: 4px solid #4f46e5;
}
.q-card {
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
}
.q-card.unanswered-highlight {
    border-color: #ef4444;
    box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.1);
}
.q-title {
    font-size: 14px;
    font-weight: 500;
    color: #1e293b;
    margin-bottom: 12px;
}
.options-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
}
.opt-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 10px 4px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    background: #ffffff;
    cursor: pointer;
    transition: all 0.2s ease;
    user-select: none;
}
.opt-btn:hover {
    background: #f8fafc;
    border-color: #94a3b8;
}
.opt-btn.active {
    background: #4f46e5;
    color: #ffffff;
    border-color: #4f46e5;
    box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
}
.opt-btn.active .opt-sub {
    color: #e0e7ff;
}
.opt-val {
    font-size: 13px;
    font-weight: 600;
}
.opt-sub {
    font-size: 11px;
    color: #64748b;
    margin-top: 2px;
    text-align: center;
}
@media (max-width: 600px) {
    .options-grid {
        grid-template-columns: repeat(1, 1fr);
    }
    .opt-btn {
        flex-direction: row;
        justify-content: space-between;
        padding: 12px 16px;
    }
    .opt-sub {
        margin-top: 0;
        font-size: 13px;
    }
}
.actions {
    margin-top: 32px;
    display: flex;
    gap: 12px;
}
.btn {
    flex: 1;
    padding: 14px 20px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: all 0.2s ease;
    text-align: center;
}
.btn-primary {
    background: #4f46e5;
    color: #ffffff;
    box-shadow: 0 4px 14px rgba(79, 70, 229, 0.3);
}
.btn-primary:hover {
    background: #4338ca;
}
.btn-secondary {
    background: #f1f5f9;
    color: #475569;
    border: 1px solid #cbd5e1;
}
.btn-secondary:hover {
    background: #e2e8f0;
}
.result-card {
    display: none;
    margin-top: 28px;
    padding: 24px;
    background: #f8fafc;
    border: 1px solid #c7d2fe;
    border-radius: 14px;
}
.result-title {
    font-size: 16px;
    font-weight: 700;
    color: #1e1b4b;
    margin-bottom: 8px;
}
.score-badge {
    display: inline-block;
    background: #4f46e5;
    color: #ffffff;
    font-size: 18px;
    font-weight: 700;
    padding: 4px 14px;
    border-radius: 999px;
    margin-bottom: 12px;
}
.result-desc {
    font-size: 14px;
    color: #334155;
    line-height: 1.6;
}
</style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>亲密关系自我倾向自评问卷</h1>
        <p>评估在双人互动中的行为模式与自我中心倾向</p>
        <div class="progress-container">
            <div class="progress-text">
                <span>完成进度</span>
                <span id="progressText">0 / 16</span>
            </div>
            <div class="progress-bar-wrap">
                <div id="progressBar" class="progress-bar-fill"></div>
            </div>
        </div>
    </div>

    <form id="quizForm">
        <div id="questions"></div>
        <div class="actions">
            <button type="button" class="btn btn-secondary" onclick="resetForm()">重置</button>
            <button type="button" class="btn btn-primary" onclick="calcResult()">提交评估</button>
        </div>
    </form>

    <div id="result" class="result-card">
        <div class="result-title">评估结果解读</div>
        <div id="scoreText" class="score-badge"></div>
        <p id="analysisText" class="result-desc"></p>
    </div>
</div>

<script>
const data = [
    {
        title: "一、 关系特权感与主导倾向",
        items: [
            "在与伴侣发生意见分歧时，我通常确信自己的观点才是最合理的。",
            "我希望伴侣在规划日常行程时，能够优先考虑我的时间和需求。",
            "在决定两人的共同事务时，我倾向于由自己掌握最终的决定权。",
            "我认为自己在亲密关系中付出的价值和重要性高于伴侣。"
        ]
    },
    {
        title: "二、 共情表达与需求平衡",
        items: [
            "当伴侣向我倾诉负面情绪时，我有时会感到难以专注或产生疲惫感。",
            "在双方需求发生冲突时，我会优先保障自己的利益不受损害。",
            "我希望伴侣能够及时回应我的联系，但我有时无法以相同的即时性回应对方。",
            "当伴侣的言行未能达到我的预期时，我的情感投入会明显降低。"
        ]
    },
    {
        title: "三、 冲突应对与防御心理",
        items: [
            "当伴侣对我提出批评或指出缺点时，我的第一反应通常是感到被冒犯并进行辩解。",
            "在发生冲突或争执后，我极少会主动承认错误或向对方道歉。",
            "我倾向于将关系中出现的矛盾归因于伴侣的性格或沟通方式。",
            "当伴侣令我不满时，我有时会通过减少交流或拉开距离来表达不快。"
        ]
    },
    {
        title: "四、 认可需求与关系期待",
        items: [
            "我需要伴侣频繁表达对我的认可、赞美与情绪支持。",
            "我很看重伴侣在社交场合或亲友面前的表现能否提升我的形象。",
            "一旦伴侣展现出我不赞同的缺点，我对这段关系的满意度会显著下降。",
            "当伴侣的立场与我不一致时，我会尝试说服对方接受我的观点。"
        ]
    }
];

const opts = ["完全不符合", "比较不符合", "有时符合", "比较符合", "完全符合"];
const answers = {};

function render() {
    let html = "";
    let qIndex = 1;
    data.forEach(group => {
        html += `<div class="section-title">${group.title}</div>`;
        group.items.forEach(item => {
            html += `<div class="q-card" id="qcard-${qIndex}">
                <div class="q-title">${qIndex}. ${item}</div>
                <div class="options-grid">`;
            opts.forEach((optText, v) => {
                const val = v + 1;
                html += `<div class="opt-btn" id="opt-${qIndex}-${val}" onclick="selectValue(${qIndex}, ${val})">
                    <span class="opt-val">${val}分</span>
                    <span class="opt-sub">${optText}</span>
                </div>`;
            });
            html += `</div></div>`;
            qIndex++;
        });
    });
    document.getElementById("questions").innerHTML = html;
}

function selectValue(qNum, val) {
    answers[qNum] = val;
    
    const card = document.getElementById(`qcard-${qNum}`);
    card.classList.remove("unanswered-highlight");
    
    for (let i = 1; i <= 5; i++) {
        const btn = document.getElementById(`opt-${qNum}-${i}`);
        if (btn) btn.classList.remove("active");
    }
    
    const selectedBtn = document.getElementById(`opt-${qNum}-${val}`);
    if (selectedBtn) selectedBtn.classList.add("active");
    
    updateProgress();
}

function updateProgress() {
    const answeredCount = Object.keys(answers).length;
    document.getElementById("progressText").innerText = `${answeredCount} / 16`;
    const pct = (answeredCount / 16) * 100;
    document.getElementById("progressBar").style.width = `${pct}%`;
}

function calcResult() {
    let firstUnanswered = null;
    for (let i = 1; i <= 16; i++) {
        if (!answers[i]) {
            const card = document.getElementById(`qcard-${i}`);
            if (card) card.classList.add("unanswered-highlight");
            if (!firstUnanswered) firstUnanswered = card;
        }
    }

    if (firstUnanswered) {
        firstUnanswered.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
    }

    let total = 0;
    for (let i = 1; i <= 16; i++) {
        total += answers[i];
    }

    const resDiv = document.getElementById("result");
    const scoreText = document.getElementById("scoreText");
    const analysisText = document.getElementById("analysisText");

    resDiv.style.display = "block";
    scoreText.innerText = "总分：" + total + " 分";

    if (total <= 32) {
        analysisText.innerText = "结果判定：相互型特质（16-32分）。你在亲密关系中展现出较好的对等沟通意识，能够有效兼顾自身与伴侣的需求。";
    } else if (total <= 48) {
        analysisText.innerText = "结果判定：中度自我中心（33-48分）。你在特定情境下存在较强的自我保护意识或控制倾向，容易引发互动中的摩擦，建议多留意双方边界。";
    } else {
        analysisText.innerText = "结果判定：高度关系自恋倾向（49-80分）。你在互动中展现出显著的特权感、高防御性及共情局限，自我中心倾向较强。";
    }

    resDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function resetForm() {
    for (let key in answers) {
        delete answers[key];
    }
    document.querySelectorAll(".opt-btn").forEach(btn => btn.classList.remove("active"));
    document.querySelectorAll(".q-card").forEach(card => card.classList.remove("unanswered-highlight"));
    document.getElementById("result").style.display = "none";
    updateProgress();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

render();
</script>
</body>
</html>
